  <g fill="#1a1a1a" stroke="none" font-size="11">
    <text x="18" y="240" font-size="12">L (230 В AC)</text>
    <text x="18" y="420" font-size="12">N (230 В AC)</text>
    <text x="14" y="472" font-size="12">PE</text>
    <text x="248" y="490" font-size="12">→ корпус приладу і двигуна</text>
    <text x="127" y="206" text-anchor="middle">QF1 2P</text>
    <text x="127" y="221" text-anchor="middle">16–25 А</text>
    <text x="245" y="238" text-anchor="middle">F1 T10A</text>
    <text x="405" y="140" font-size="13">K1 — байпас-реле (NO–COM), 25–40 А</text>
    <text x="405" y="157" font-size="11">(котушка — модуль реле, IN від GPIO6)</text>
    <text x="500" y="200" text-anchor="middle" font-size="12">VS1 BTA41-600B</text>
    <text x="428" y="228" text-anchor="middle" font-size="10">MT2</text>
    <text x="572" y="228" text-anchor="middle" font-size="10">MT1</text>
    <text x="520" y="476" font-size="11">G → до блока керування затвором (нижче)</text>
    <text x="520" y="316" font-size="11">R_sn 100 Ω · 2 W</text>
    <text x="661" y="378" text-anchor="middle" font-size="11">C_sn 0.1 µF X2</text>
    <text x="414" y="372" font-size="11">RV1 MOV 275 VAC</text>
    <text x="705" y="252" font-size="10">IP+</text>
    <text x="785" y="240" font-size="12">U3</text>
    <text x="782" y="266" font-size="13">ACS712-30A</text>
    <text x="785" y="290" font-size="10">(IP+ → IP− по фазі)</text>
    <text x="1125" y="243" text-anchor="middle" font-size="13">НАВАНТАЖЕННЯ</text>
    <text x="1125" y="270" text-anchor="middle" font-size="13">ДВИГУН</text>
    <text x="1125" y="297" text-anchor="middle" font-size="13">≈ 2 кВт</text>
    <text x="1130" y="355" font-size="10">N_LOAD</text>
    <text x="60" y="560" font-size="13" font-weight="bold">ДЕТЕКТОР НУЛЯ (ZC) — гальванічно розв'язаний</text>
    <text x="352" y="586" font-size="11">R2 33k 2 W</text>
    <text x="560" y="634" text-anchor="middle" font-size="12">DB107</text>
    <text x="560" y="654" text-anchor="middle" font-size="10">(VD1)</text>
    <text x="375" y="668" text-anchor="middle" font-size="11">R3 33k 2 W</text>
    <text x="630" y="586" font-size="11">R4 1 kΩ</text>
    <text x="795" y="542" text-anchor="middle" font-size="11">гальванічна розв'язка</text>
    <text x="918" y="574" font-size="11">R5 10k</text>
    <text x="916" y="543" font-size="11">+3.3 V</text>
    <text x="912" y="706" font-size="11">GPIO5 (вхід з перериванням)</text>
    <text x="845" y="782" font-size="10">GND (ESP32)</text>
    <text x="1008" y="590" font-size="13" font-weight="bold">Ланцюг керування затвором VS1 (U1)</text>
    <text x="925" y="660" text-anchor="end" font-size="11">GPIO4</text>
    <text x="993" y="638" text-anchor="end" font-size="11">R1 150 Ω</text>
    <text x="915" y="775" font-size="10">GND</text>
    <text x="1218" y="638" font-size="11">Rg 360 Ω</text>
    <text x="1268" y="692" font-size="10">затвор (G)</text>
    <text x="1352" y="692" font-size="10">R_gk 1 kΩ</text>
    <text x="1478" y="640" text-anchor="end" font-size="11">до MT1 (вузол B)</text>
    <text x="1478" y="742" text-anchor="end" font-size="11">з MT2 (вузол A)</text>
    <text x="1002" y="800" font-size="10">GPIO4 → R1: If ≈ 13 мА; імпульс U1 → Rg → затвор; R_gk — стійкість до dV/dt.</text>
    <text x="40" y="935" font-size="11">З'єднання: A: MT2 · COM K1 · R_sn→C_sn → B · R2→AC1 | B: MT1 · NO K1 · C_sn · IP+ | N: AC2 через R3 · RV1 | Розпіновка ESP32 без змін (GPIO4/5/6/1/9)</text>
    <!-- pin numbers -->
    <text x="1034" y="650" text-anchor="end" font-size="9">1</text>
    <text x="1034" y="716" text-anchor="end" font-size="9">2</text>
    <text x="1206" y="650" font-size="9">6</text>
    <text x="1206" y="716" font-size="9">4</text>
  </g>
</svg>
