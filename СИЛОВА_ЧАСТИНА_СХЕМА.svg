  <text x="40" y="45" font-size="18" font-weight="bold" fill="#1a1a1a">Силова частина реле плавного пуску ~2 кВт (v1.1)</text>
  <text x="40" y="67" font-size="12" fill="#1a1a1a">ESP32-C3 MINI · SoftStart-2kW v1.0.0 · 230 В AC / 50 Гц · зміни: +F1, +RV1 (MOV 275 VAC), R1 150 Ом, R2/R3 33 кОм, снаббер 100 Ω + 0.1 µF X2, +R_gk 1 кΩ</text>

